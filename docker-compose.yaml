services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Do not publish 27017 unless you need Compass on the host.

  backend:
    build: ./backend
    ports:
      - "3000:5000"
    environment:
      PORT: "5000"
      MONGODB_URI: mongodb://mongo:27017/huddle
      JWT_SECRET: replace_this_with_a_long_random_string
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo_data: